<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="0.55" stop-color="#101115"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <!-- acero pulido reluciente: foco de luz arriba-izquierda -->
    <radialGradient id="plate" cx="0.36" cy="0.30" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#eef0f4"/>
      <stop offset="0.42" stop-color="#c2c7cf"/>
      <stop offset="0.62" stop-color="#9197a1"/>
      <stop offset="0.82" stop-color="#6b707a"/>
      <stop offset="1" stop-color="#aeb4bd"/>
    </radialGradient>
    <radialGradient id="hub" cx="0.4" cy="0.34" r="0.9">
      <stop offset="0" stop-color="#dfe2e8"/>
      <stop offset="0.5" stop-color="#8d929c"/>
      <stop offset="1" stop-color="#5b5f68"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.36" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- sombra del disco -->
  <ellipse cx="256" cy="272" rx="198" ry="198" fill="#000000" opacity="0.45"/>

  <!-- cuerpo del disco -->
  <circle cx="256" cy="256" r="198" fill="url(#plate)"/>
  <!-- ranuras concentricas -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#4c505a" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#5a5f69" stroke-width="3" opacity="0.55"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#5a5f69" stroke-width="3" opacity="0.5"/>

  <!-- serigrafia: HIERRO arriba, Fe 26 abajo -->
  <text x="256" y="158" text-anchor="middle" fill="#16181c"
        font-family="'Arial Narrow', Arial, sans-serif" font-size="50" font-weight="700"
        letter-spacing="3">HIERRO</text>
  <text x="256" y="382" text-anchor="middle" fill="#26292f"
        font-family="'Arial Narrow', Arial, sans-serif" font-size="26" font-weight="700"
        letter-spacing="4">Fe · 26</text>

  <!-- cubo central + agujero de la barra -->
  <circle cx="256" cy="256" r="64" fill="url(#hub)" stroke="#3d4149" stroke-width="2"/>
  <circle cx="256" cy="256" r="38" fill="#0c0d10"/>
  <circle cx="256" cy="256" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- huecos de agarre -->
  <circle cx="346" cy="300" r="12" fill="#0e1013" opacity="0.85"/>
  <circle cx="166" cy="300" r="12" fill="#0e1013" opacity="0.85"/>
  <circle cx="256" cy="346" r="12" fill="#0e1013" opacity="0.85"/>

  <!-- brillo especular -->
  <circle cx="256" cy="256" r="198" fill="url(#gloss)"/>
  <path d="M120,150 A198,198 0 0 1 360,108 A150,150 0 0 0 150,210 Z" fill="#ffffff" opacity="0.22"/>
</svg>
